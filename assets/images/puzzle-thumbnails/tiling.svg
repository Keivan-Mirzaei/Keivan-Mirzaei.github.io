  <rect x="65" y="50" width="310" height="310" rx="6" fill="#e7eae1" stroke="#ccd4c7"/>
  <g transform="translate(80 65) scale(1.25)" stroke-linejoin="round">
    <path d="M0 0h168v56h56v112h-56v56H56v-56H0Z" fill="#fcfcf9"/>
    <path d="M168 0h56v56h-56ZM0 168h56v56H0Zm168 0h56v56h-56Z" fill="url(#hatch)"/>
    <path d="M56 0v224m56-224v224m56-224v224M0 56h224M0 112h224M0 168h224" fill="none" stroke="#dce2d5"/>
