            <title id="bridge-title">The calculus bridge</title><desc id="bridge-desc">Two circular scenes show a tangent and an accumulated area, connected by curved arrows for differentiation and integration.</desc>
            <defs><pattern id="bridge-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" class="diagram-grid"/></pattern><clipPath id="bridge-left"><circle cx="159" cy="172" r="101"/></clipPath><clipPath id="bridge-right"><circle cx="441" cy="172" r="101"/></clipPath></defs>
            <circle cx="159" cy="172" r="101" fill="#fcfcf9" stroke="#e0e4dc" stroke-width="1.5"/><circle cx="441" cy="172" r="101" fill="#fcfcf9" stroke="#e0e4dc" stroke-width="1.5"/>
            <g clip-path="url(#bridge-left)"><rect class="diagram-grid" x="50" y="64" width="218" height="218" style="fill:url(#bridge-grid);stroke:none"/><path d="M70 234H246M82 247V97" class="axis"/><path d="M91 223Q145 216 228 112" class="curve"/><path d="M115 221.931 227 131.184" class="tangent"/><circle cx="152.25" cy="191.75" r="5" fill="#ad7647" stroke="#fcfcf9" stroke-width="2"/></g>
            <g clip-path="url(#bridge-right)"><rect class="diagram-grid" x="330" y="64" width="218" height="218" style="fill:url(#bridge-grid);stroke:none"/><path d="M379 224Q440 230 511 119V235H379Z" fill="#dce7d7"/><path d="M350 235H530M365 247V97" class="axis"/><path d="M379 224Q440 230 511 119" class="curve"/></g>
