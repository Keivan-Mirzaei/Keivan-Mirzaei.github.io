<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">A mug, a donut, a tube, and a square</title><desc id="desc">The mug's handle hole becomes the donut hole. Cut one loop to open the donut into a tube, and slit the tube to get a square. Pair the square's opposite sides to reconstruct the donut.</desc>
  <style>text{font-family:system-ui,sans-serif;font-size:14px;fill:#285b46}.surface{fill:#c4d5b9;stroke:#42664b;stroke-width:2}.hole{fill:#fcfcf9;stroke:#8769a2;stroke-width:3}.arrow{fill:none;stroke:#686e66;stroke-width:2}</style>
  <g transform="translate(85 80)"><path class="surface" d="M-46 -28 Q0 -48 46 -28V-18C105 -52 108 58 46 44V67Q0 92 -46 67Z"/><ellipse class="hole" cx="68" cy="13" rx="17" ry="25"/><ellipse class="surface" cy="-28" rx="46" ry="11"/><ellipse cx="0" cy="-29" rx="36" ry="6" fill="#75936d"/><text x="0" y="113" text-anchor="middle">Mug</text></g>
  <path class="arrow" d="M198 89h47m-9 -7l9 7 -9 7"/><text x="224" y="126" text-anchor="middle">reshape</text>
  <g transform="translate(335 94)"><ellipse class="surface" rx="64" ry="43"/><ellipse class="hole" rx="31" ry="18"/><text x="0" y="99" text-anchor="middle">Donut</text></g>
  <path class="arrow" d="M419 89h45m-9 -7l9 7 -9 7"/><text x="444" y="126" text-anchor="middle">cut loop</text>
  <g transform="translate(559 94)"><path class="surface" d="M-53 -23H53V23H-53Z"/><ellipse class="surface" cx="-53" rx="13" ry="23"/><ellipse class="hole" cx="53" rx="13" ry="23"/><text x="0" y="99" text-anchor="middle">Open tube</text></g>
  <path class="arrow" d="M559 216v34H442m9 -7l-9 7 9 7"/><text x="530" y="241" text-anchor="middle">slit tube</text>
  <g transform="translate(335 276)"><rect x="-60" y="-47" width="120" height="94" fill="#e5ece2"/><path d="M-60 -47H60M-60 47H60" stroke="#285b46" stroke-width="6" stroke-dasharray="14 9"/><path d="M-60 -47V47M60 -47V47" stroke="#8769a2" stroke-width="6" stroke-dasharray="14 9"/><text x="0" y="5" text-anchor="middle">Glued square</text></g>
</svg>
