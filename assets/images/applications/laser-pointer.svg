<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Laser Pointer</title>
  <defs>
    <linearGradient id="porcelain" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f0f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-15%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dy="20" stdDeviation="22" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect x="80" y="64" width="864" height="864" rx="196" fill="url(#porcelain)" filter="url(#shadow)"/>
  <rect x="82" y="66" width="860" height="860" rx="194" fill="none" stroke="#53535d" stroke-opacity=".06" stroke-width="4"/>
  <circle cx="512" cy="496" r="216" fill="none" stroke="#53535d" stroke-width="32"/>
  <circle cx="512" cy="496" r="64" fill="#ff304b"/>
</svg>
