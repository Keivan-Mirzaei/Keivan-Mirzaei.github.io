<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
<title id="title">A rotating beam meets a wall</title>
<desc id="desc">A lamp on the left shines towards a vertical wall on the right. A dashed perpendicular joins the lamp to the wall. The beam angles upward to the light spot, forming a right triangle.</desc>
