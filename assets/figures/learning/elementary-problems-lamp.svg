<path d="M444 260V244H460" fill="none" stroke="#9eac96" stroke-width="1.2"/>
<path d="M149 260A49 49 0 0 0 143.58 237.61" fill="none" stroke="#285b46" stroke-width="1.5"/>
<path d="M490 75V260M484 75H496M484 260H496" fill="none" stroke="#9eac96" stroke-width="1.2"/>
<circle cx="100" cy="260" r="5" fill="#285b46"/>
<circle cx="460" cy="75" r="6" fill="#a67936"/>
<g fill="#686e66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">
