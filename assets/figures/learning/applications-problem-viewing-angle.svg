<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">The angle occupied by a picture</title>
<desc id="desc">Two lines of sight go from the observer’s eye to the picture’s bottom and top, respectively one and three metres above eye level. Theta is the angle between the two sight lines. The observer is horizontal distance x from the wall.</desc>
