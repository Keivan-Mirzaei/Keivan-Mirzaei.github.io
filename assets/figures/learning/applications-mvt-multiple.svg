<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Two tangents parallel to one secant</title>
<desc id="desc">The curve x cubed on minus one to one has a blue secant of slope one. Two amber tangents at c minus equals minus one divided by square root three and c plus equals one divided by square root three have that same slope.</desc>
