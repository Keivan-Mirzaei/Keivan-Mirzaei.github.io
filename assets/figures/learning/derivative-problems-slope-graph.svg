<g fill="#686e66" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<g text-anchor="middle"><text x="100" y="304">−2</text><text x="210" y="304">−1</text><text x="430" y="304">1</text><text x="540" y="304">2</text></g>
<g text-anchor="end"><text x="305" y="230">1</text><text x="305" y="175">2</text><text x="305" y="65">4</text><text x="305" y="304">0</text></g></g>
