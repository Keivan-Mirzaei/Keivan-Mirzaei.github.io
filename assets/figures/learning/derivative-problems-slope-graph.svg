<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">The derivative of the joined line and parabola</title>
<desc id="desc">On minus two to zero, the derivative is the constant one. On zero to two, it is two x. Both branches are open at zero, where the derivative is undefined. The displayed interval endpoints are also excluded.</desc>
