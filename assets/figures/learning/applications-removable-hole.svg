<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">Cancellation leaves a missing point</title>
<desc id="desc">The graph of x squared minus one divided by x minus one agrees with the line y equals x plus one except at input one. An open point at one, two and fine horizontal and vertical guides identify the missing value.</desc>
