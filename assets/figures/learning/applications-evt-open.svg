<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">An open interval can exclude both extreme values</title>
<desc id="desc">The graph f(x) equals x on the open interval zero to one. Open circles at zero, zero and one, one show that neither endpoint belongs to the graph. The values approach zero and one, but no absolute minimum or maximum is attained.</desc>
