<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">A vanishing product with an unbounded logarithm</title>
<desc id="desc">The graph of x times natural log x on zero to one lies below the horizontal axis. As x approaches zero from the right, the curve approaches the missing point at the origin from below.</desc>
