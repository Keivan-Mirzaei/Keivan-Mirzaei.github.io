<svg xmlns="http://www.w3.org/2000/svg" width="640" height="445" viewBox="0 0 640 445" role="img" aria-labelledby="title desc">
<title id="title">Walking distance, shadow length and shadow-tip position</title>
<desc id="desc">A six-metre lamp and a two-metre person stand on level ground. One light ray runs from the lamp top through the person top to the shadow tip, forming two similar right triangles. Distance x runs from lamp to person, s from person to tip, and x plus s from lamp to tip. The person walks right at one and a half metres per second.</desc>
