<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">A line meets a parabola</title>
<desc id="desc">The line from minus two, minus one to zero, one joins the parabola y equals one plus x squared. The function is continuous at zero, but its two slopes disagree.</desc>
<path d="M70 280H580M320 335V30" fill="none" stroke="#c9d1c6"/>
<path d="M100 277V283M210 277V283M430 277V283M540 277V283M317 325H323M317 235H323M317 145H323M317 55H323" fill="none" stroke="#9eac96"/>
<path d="M100 325L320 235Q430 235 540 55" fill="none" stroke="#285b46" stroke-width="2.6"/>
<g fill="#686e66" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<g text-anchor="middle"><text x="100" y="304">−2</text><text x="210" y="304">−1</text><text x="430" y="304">1</text><text x="540" y="304">2</text></g>
<g text-anchor="end"><text x="305" y="330">−1</text><text x="305" y="240">1</text><text x="305" y="150">3</text><text x="305" y="60">5</text><text x="305" y="304">0</text></g></g>
<g fill="#282e29" font-family="Georgia,serif" font-style="italic" font-size="17"><text x="591" y="286">x</text><text x="331" y="32">y</text></g>
<g transform="translate(492 320)"><rect width="68" height="28" rx="4" fill="#edf1e9"/><path d="M10 14H29" stroke="#285b46" stroke-width="2.6"/><text x="42" y="20" font-family="Georgia,serif" font-style="italic" font-size="17" fill="#285b46">f</text></g>
</svg>
