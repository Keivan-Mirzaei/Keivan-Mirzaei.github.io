<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
<title id="title">From a square sheet to an open box</title>
<desc id="desc">Four corner squares of side x are removed from a twelve centimetre square sheet. Blue dashed lines mark the folds. Both views use the same scale for the flap width and vertical height x, and for the base width twelve minus two x. The depth of the folded base is shown in perspective.</desc>
