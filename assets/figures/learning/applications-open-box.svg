<text x="67" y="22" fill="#686e66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19">Cut out the corners</text>
<text x="405" y="22" fill="#686e66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19">Fold up the sides</text>
