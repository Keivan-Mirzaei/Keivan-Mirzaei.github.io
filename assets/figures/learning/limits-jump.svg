<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">A jump: two different approached heights</title><desc id="desc">The function is 1 for negative inputs and 3 for nonnegative inputs. An open circle is at zero,1 and a filled point at zero,3. The approached heights differ.</desc><style>.axis{stroke:#c9d1c6;stroke-width:1}.guide{stroke:#d6ddd2;stroke-width:1;stroke-dasharray:3 5}.curve{fill:none;stroke:#285b46;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.label{font:14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#686e66}.axis-name{font:italic 17px Georgia,serif;fill:#282e29}.point{fill:#285b46;stroke:#fcfcf9;stroke-width:2}</style><path class="axis" d="M55 300H595M320 320V30"/>
