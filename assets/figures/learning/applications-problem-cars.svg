<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">Two cars on perpendicular roads</title>
<desc id="desc">One car is three kilometres east of the intersection, moving east at sixty kilometres per hour. A second car is four kilometres north, moving south at forty kilometres per hour. The diagonal s joins the cars.</desc>
