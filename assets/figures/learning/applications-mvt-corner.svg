<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">A corner prevents a matching tangent</title>
<desc id="desc">The absolute-value graph on minus one to one has equal endpoint values of one. The blue horizontal secant has slope zero. At the amber corner at zero there is no derivative; on the two branches the slopes are minus one and one.</desc>
