<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">Similar triangles in a filling conical tank</title>
<desc id="desc">A vertical cross-section of an inverted cone has height six metres and top radius two metres. The water is three metres deep, half the tank height. Its depth h and surface radius r form a smaller right triangle sharing the tank vertex. A downward arrow indicates an inflow of half a cubic metre per minute.</desc>
