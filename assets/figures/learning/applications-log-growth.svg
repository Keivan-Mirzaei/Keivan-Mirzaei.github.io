<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">An unbounded numerator and a vanishing ratio</title>
<desc id="desc">The graph of natural log x divided by x is shown for x at least one. It first rises and then decreases toward zero from above. Both the numerator and denominator still grow without bound.</desc>
