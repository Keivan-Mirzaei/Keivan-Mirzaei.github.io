<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 10 440 400" role="img" aria-labelledby="title desc">
  <title id="title">Eight disjoint regions give a lower bound of sixteen detectors</title>
  <desc id="desc">Eight disjoint two-by-three or three-by-two rectangles partition all but the central square of a seven-by-seven board. Each requires at least two detectors to distinguish its two spaceship positions from an empty board.</desc>
