<g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#686e66">
<text x="170" y="31">1</text><text x="125" y="79">1</text>
<text x="220" y="31">2</text><text x="125" y="129">2</text>
<text x="270" y="31">3</text><text x="125" y="179">3</text>
<text x="320" y="31">4</text><text x="125" y="229">4</text>
<text x="370" y="31">5</text><text x="125" y="279">5</text>
<text x="420" y="31">6</text><text x="125" y="329">6</text>
<text x="470" y="31">7</text><text x="125" y="379">7</text>
</g>
<text x="320" y="436" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#285b46">Eight disjoint regions × at least 2 detectors = at least 16</text>
<text x="320" y="464" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#686e66">Each region is 2 × 3 or 3 × 2; the central square is left over.</text>
</svg>
