<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 30 340 330" role="img" aria-labelledby="title desc">
  <title id="title">A chord of a unit circle</title>
  <desc id="desc">Points A and B lie on the circle. Their straight-line distance is the solid chord. A dashed radius from O to A has length one.</desc>
  <circle cx="320" cy="195" r="140" fill="#fcfcf9" stroke="#285b46" stroke-width="2.5" />
  <path d="M320 195L460 195" stroke="#686e66" stroke-width="2" stroke-dasharray="6 6" />
  <path d="M460 195L250 73.76" stroke="#285b46" stroke-width="4" />
  <g fill="#285b46">
    <circle cx="460" cy="195" r="6" />
    <circle cx="250" cy="73.76" r="6" />
    <circle cx="320" cy="195" r="4" />
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#282e29">
    <text x="473" y="201">A</text>
    <text x="230" y="59">B</text>
    <text x="298" y="220">O</text>
    <text x="387" y="220">1</text>
  </g>
</svg>
