<svg xmlns="http://www.w3.org/2000/svg" width="600" height="255" viewBox="0 0 600 255" role="img" aria-labelledby="euler-tree-and-regions-title euler-tree-and-regions-description">
<title id="euler-tree-and-regions-title">Restoring edges to a spanning tree</title>
<desc id="euler-tree-and-regions-description">Four vertices remain fixed. The three-edge tree has one face; restoring a fourth edge gives two faces; restoring a diagonal gives three. Each count includes the outside face.</desc>
