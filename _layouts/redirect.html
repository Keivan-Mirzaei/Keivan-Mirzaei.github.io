{% assign redirect_url = site[page.redirect_key] | default: page.redirect_to %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <link rel="canonical" href="{{ redirect_url | absolute_url }}">
  <meta http-equiv="refresh" content="0; url={{ redirect_url | relative_url }}">
</head>
<body><p>This page has moved to <a href="{{ redirect_url | relative_url }}">{{ page.title }}</a>.</p></body>
</html>
