<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · Puzzles · {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="theme-color" content="#fcfcf9">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% include site-icons.html %}
  <link rel="stylesheet" href="{{ '/assets/css/puzzles.css' | relative_url }}">

  {% include widget-assets.html %}
</head>
<body class="puzzle-page{% if page.game_layout == 'board-first' %} puzzle-board-first{% endif %}">
  <a class="skip-link" href="#main">Skip to game</a>
  <div class="puzzle-shell">
    <header class="puzzle-heading">
      <a class="puzzle-back" href="{{ '/puzzles/' | relative_url }}"><span aria-hidden="true">←</span> Puzzles</a>
      {% unless page.game_layout == 'board-first' %}<h1>{{ page.title }}</h1>{% endunless %}
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
  </div>
</body>
</html>
