title: Almost Obvious
description: A notebook of mathematical problems, explorations, research, and puzzles to play.
url: https://keivan-mirzaei.com
baseurl: ""
lang: en
timezone: America/Edmonton
author: Keivan Mirzaei
email: keivan.mirzaei@outlook.com
linkedin_url: https://www.linkedin.com/in/k1-mirzaei/

permalink: /notes/:title/
paginate: 5
paginate_path: /notes/page/:num/
feed:
  excerpt_only: true # Keep solutions out of feed previews.
collections:
  research:
    output: true
    permalink: /research/:name/
    sort_by: order
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

defaults:
  - scope:
      path: "learning"
    values:
      section: learning
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: notes
      search: true
  - scope:
      path: ""
      type: research
    values:
      layout: research
      section: research
      search: true
      order: 100

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - docs
  - scripts
  - tests
  - vendor
