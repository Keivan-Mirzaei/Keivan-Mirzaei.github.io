introductory-calculus:
  title: Introductory Calculus
  url: /learning/introductory-calculus/
  level: University Calculus I–II
  description: A first-year single-variable sequence, from limits and rates of change to integration, differential equations, and infinite series.
  image: /assets/images/introductory-calculus.svg
  image_alt: Two circular scenes show a tangent and accumulated area, connected by curved arrows linking differentiation and integration.
  lesson_count: 6
  start_label: Start with functions
  scope: These notes follow a standard first-year university sequence with trigonometry, suitable for mathematics, science, and engineering. Calculus I develops change and accumulation; Calculus II develops integration, models, and approximation. The division below is a study guide, since universities place some topics in different terms.
  outcomes:
    - Interpret functions, limits, and continuity using formulas, graphs, tables, and words, and calculate limits with an appropriate method.
    - Explain a derivative as an instantaneous rate and tangent slope; compute derivatives from the definition and with differentiation rules.
    - Use derivatives and the hypotheses of calculus theorems to analyze graphs, estimate values, and solve optimization and related-rates problems.
    - Explain a definite integral as a limit of sums and as net accumulation, and use both parts of the Fundamental Theorem of Calculus.
    - Choose and carry out integration methods, and assess numerical approximations and convergence of improper integrals.
    - Build and interpret calculus models for motion, area, volume, and other accumulated quantities, with correct units and assumptions.
    - Interpret direction fields and solve elementary separable differential equations and initial-value problems.
    - Determine convergence of sequences and series, work with power and Taylor series, and justify approximation errors.
    - Communicate complete mathematical reasoning, check theorem conditions, and assess the plausibility of an answer using estimates or technology.
  parts:
    - id: calculus-i
      title: "Calculus I: change and accumulation"
      description: Build the foundations, learn differentiation and its applications, and connect derivatives to definite integrals.
      url: /learning/calculus-i/
    - id: calculus-ii
      title: "Calculus II: integration, models, and series"
      description: Extend integration, study elementary differential equations, and use convergence and series to understand approximation.
  modules:
    - title: Functions, limits, and continuity
      part: calculus-i
      module_id: functions-limits
      url: /learning/calculus-i/functions-limits/
      description: Elementary functions and their graphs; one-sided, infinite, and at-infinity limits; limit laws, the squeeze theorem, continuity, and the Intermediate Value Theorem.
      outcome: Evaluate limits, locate discontinuities and asymptotes, and justify an existence claim using continuity.
    - title: "Derivatives: from rates to local linearity"
      part: calculus-i
      description: Rates and tangent lines; the derivative definition; elementary and higher derivatives; product, quotient, and chain rules; implicit, inverse, and logarithmic differentiation.
      outcome: Explain and calculate a derivative, find a tangent approximation, and recognize a failure of differentiability.
      url: /notes/derivatives/
      module_id: derivatives
    - title: What derivatives tell us about functions
      part: calculus-i
      module_id: derivative-behavior
      description: Extreme Value, Rolle's, and Mean Value Theorems; monotonicity and concavity; curve sketching; linear approximation and differentials; L'Hôpital's rule. Possible extensions include Newton's method and introductory Taylor polynomials.
      outcome: Analyze a graph and construct a local approximation while checking the hypotheses of the method used.
    - title: Applications of derivatives
      part: calculus-i
      module_id: derivative-applications
      description: Position, velocity, and acceleration; related rates; local and absolute extrema; constrained optimization with one independent variable.
      outcome: Translate a contextual problem into a derivative calculation and interpret its solution with units and domain restrictions.
    - title: Integrals and accumulation
      part: calculus-i
      module_id: integration-foundations
      description: Antiderivatives and initial conditions; Riemann sums; definite integral properties; signed area and net change; accumulation functions and both parts of the Fundamental Theorem of Calculus.
      outcome: Move between a rate and its accumulated change, explaining why differentiation and integration are connected.
    - title: Basic integration and its applications
      part: calculus-i
      module_id: basic-integration
      description: Elementary antiderivatives and substitution, including changed bounds; total change and total distance; area between curves, average value, and volumes by cross-sections, disks, washers, and shells.
      outcome: Evaluate basic integrals and set up a definite integral from a geometric or rate-based description.
    - title: Techniques of integration
      part: calculus-ii
      description: Integration by parts; trigonometric integrals and substitutions; partial fractions; choosing and combining integration methods.
      outcome: Select a suitable integration method and check an antiderivative by differentiation.
    - title: Further applications of integrals
      part: calculus-ii
      description: Arc length and surface area; work, variable forces, and hydrostatic force; mass, moments, and centers of mass. Probability densities provide a syllabus-dependent application.
      outcome: Derive an integral from small contributions and interpret the result in the original setting.
    - title: Numerical integration and improper integrals
      part: calculus-ii
      description: Midpoint, trapezoidal, and Simpson's rules with error estimates; unbounded intervals and singular integrands; convergence and comparison of improper integrals.
      outcome: Approximate an integral to a stated accuracy and determine whether an improper integral converges.
    - title: Elementary differential equations
      part: calculus-ii
      description: Solution checking, direction fields, and Euler's method; separable equations and initial values; exponential growth and decay, equilibrium, and logistic models. First-order linear equations are an optional addition.
      outcome: Solve a separable initial-value problem and compare its solution with the qualitative behavior of the model.
    - title: Sequences and infinite series
      part: calculus-ii
      description: Sequence limits and partial sums; geometric, telescoping, harmonic, and p-series; divergence, integral, comparison, limit comparison, ratio, root, and alternating-series tests; absolute and conditional convergence.
      outcome: Choose and justify a convergence test and bound the error of an alternating-series approximation.
    - title: Power series and Taylor approximation
      part: calculus-ii
      description: Radius and interval of convergence, including endpoints; differentiation and integration of power series; Taylor and Maclaurin polynomials and series; remainder estimates and applications.
      outcome: Represent a function by a power series where valid and justify the accuracy of a polynomial approximation.
    - title: Parametric and polar curves
      part: calculus-ii
      description: Parametric motion, tangents, and arc length; polar graphs and area. This module supplies a common addition whose placement varies by university.
      outcome: Apply differentiation and integration to a curve given parametrically or in polar coordinates.
  study_approach:
    - Each lesson connects a concept to graphical, numerical, verbal, and symbolic representations, then develops the relevant calculation.
    - Practice progresses from short conceptual checks and routine calculations to applications and mixed problems that require choosing a method.
    - Module checkpoints combine explanation, computation, and modeling. Cumulative reviews revisit earlier ideas and require complete solutions.
    - Proofs of central results support the main course. Advanced counterexamples and analysis problems are marked as optional enrichment.
  prerequisites:
    - Algebra, including equations, inequalities, and manipulating fractions.
    - Function notation and graphs, including polynomial, exponential, and logarithmic functions.
    - Basic trigonometry, including sine, cosine, and radians.
  alignment_note: This roadmap is a synthesis of the university sources below. Taylor polynomials, L'Hôpital's rule, integral applications, and differential equations may move between terms. Parametric and polar curves and probability applications are syllabus-dependent. A university requiring introductory partial derivatives needs an additional multivariable bridge; that material is outside this single-variable sequence.
  curriculum_sources:
    - title: University of British Columbia — MATH 100 learning objectives
      url: https://secure.math.ubc.ca/php/MathNet/courseinfo.php?name=100%3A1A2&session=2023W&t=outline
      description: The 2023 differential-calculus objectives emphasize functions, limits, derivatives, approximations, applications, and reasoning; additional multivariable topics are specific to that syllabus.
    - title: University of British Columbia — MATH 101 learning objectives, 2025/26
      url: https://personal.math.ubc.ca/~elyse/Math101Text/text-integral-calculus.pdf
      description: The course text contains section objectives and a collected list in its appendix, covering integration, applications, numerical methods, sequences, and series. Earlier detailed objectives also inform the differential-equations component.
      followup_url: https://www.math.ubc.ca/~wachs/Teaching/MATH101/MATH101_LearningObj.pdf
      followup_label: Earlier detailed objectives
    - title: University of Utah — Calculus I learning outcomes
      url: https://class-tools.app.utah.edu/syllabus/1254/2533/CalcI_Syllabus_Spring2025.pdf
      description: The Spring 2025 outcomes connect limits and differentiation to graph analysis, modeling, the Fundamental Theorem, and integral applications.
    - title: University of Wisconsin–Madison — Calculus I and II
      url: https://www.math.wisc.edu/undergraduate/courses-enrollment/calculus/
      description: A two-semester sequence with differentiation and basic integration followed by integration techniques, series, and elementary differential equations.
    - title: University of Alberta — MATH 144 and MATH 146
      url: https://apps.ualberta.ca/catalogue/course/math/144
      followup_url: https://apps.ualberta.ca/catalogue/course/math/146
      followup_label: MATH 146
      description: Illustrates variation in placement, with Taylor polynomials in the first course and integration, differential equations, and partial differentiation in the second.

calculus-i:
  title: Calculus I
  url: /learning/calculus-i/
  parent_id: introductory-calculus
  level: First-semester university calculus
  description: Learn to reason about limits, measure change with derivatives, and understand accumulation through definite integrals.
  module_source: introductory-calculus
  module_part: calculus-i
  lesson_count: 6
  start_label: Start with functions
  scope: The course develops calculus of real-valued functions of one real variable, including algebraic, trigonometric, exponential, logarithmic, and inverse trigonometric functions. Its core runs from limits and continuity through differentiation, the Fundamental Theorem of Calculus, substitution, and basic integral applications.
  outcomes_intro: 'By the end of Calculus I, you should be able to:'
  outcomes:
    - '**Read and describe functions.** Identify domains, compositions, and inverses, and connect formulas with graphs, tables, and contextual meanings.'
    - '**Reason about limits and continuity.** Evaluate finite, one-sided, infinite, and at-infinity limits; identify discontinuities and asymptotes; and use continuity to justify the existence of a solution.'
    - '**Explain and compute derivatives.** Use the limit definition and differentiation rules, including the chain rule and implicit differentiation, and interpret first and higher derivatives.'
    - '**Draw conclusions from derivatives.** Analyze monotonicity, extrema, and concavity; apply central theorems with their hypotheses; and construct and assess a linear approximation.'
    - '**Model changing quantities.** Formulate and solve motion, related-rates, and optimization problems, respecting units, constraints, and the domain of the model.'
    - '**Explain accumulation.** Interpret Riemann sums and definite integrals, distinguish signed accumulation from geometric area, and explain both parts of the Fundamental Theorem of Calculus.'
    - '**Integrate and apply.** Find elementary antiderivatives, use substitution, and set up definite integrals for net change, distance, area, average value, and volume.'
    - '**Justify a solution.** State assumptions, use consistent notation, explain the mathematical steps, and check an answer against its context or an independent calculation.'
  parts:
    - id: calculus-i
      title: A connected path through Calculus I
      description: Each chapter builds tools that the next chapter needs. Open a chapter's planned lesson outline to see how its central ideas develop.
  contents_note: Six chapters organize the core course. Begin with the functions lesson; the derivatives chapter also has existing lessons. The remaining lessons are being developed, and the outlines below show the planned course.
  lesson_outline:
    functions-limits:
      - title: Functions, domains, and representations
        purpose: Establish the language needed to state every later definition and model.
      - title: Approaching a value and one-sided limits
        purpose: Distinguish nearby behavior from the function's value at a point.
      - title: The precise meaning of a limit
        purpose: Make informal claims precise and explain what numerical evidence can and cannot establish.
      - title: Limit laws and useful techniques
        purpose: Justify algebraic simplification, squeeze arguments, and standard trigonometric limits before using them in derivative calculations.
      - title: Infinite limits, limits at infinity, and asymptotes
        purpose: Separate unbounded behavior near a point from long-term behavior as the input grows.
      - title: Continuity and the Intermediate Value Theorem
        purpose: Classify discontinuities and turn continuity into a justified existence argument.
    derivatives:
      - title: Average rates, instantaneous rates, and tangent slopes
        purpose: Motivate the derivative through quantities whose meaning and units can be checked.
      - title: The derivative definition and differentiability
        purpose: Compute from first principles and identify why corners and some joins fail to have derivatives.
      - title: Differentiation rules and higher derivatives
        purpose: Develop efficient calculations from the definition and interpret repeated differentiation.
      - title: Implicit, inverse, and logarithmic differentiation
        purpose: Handle relationships and function forms that are awkward to differentiate directly.
      - title: Differentiability and local linear approximation
        purpose: Connect the derivative to a local model; revisit practical estimates in the next chapter.
    derivative-behavior:
      - title: Extreme values, Rolle's Theorem, and the Mean Value Theorem
        purpose: Explain what hypotheses allow us to infer from derivatives and where those conclusions can fail.
      - title: Monotonicity, concavity, and curve sketching
        purpose: Combine first and second derivative information into a justified description of a graph.
      - title: Linear approximation and differentials
        purpose: Use a tangent model for numerical estimates and explain the limits of its accuracy.
      - title: Indeterminate forms and L'Hôpital's rule
        purpose: Use derivative information to evaluate eligible limits while checking the rule's conditions.
    derivative-applications:
      - title: Motion and the meaning of derivatives
        purpose: Interpret position, velocity, acceleration, and the distinction between velocity and speed.
      - title: Related rates
        purpose: Differentiate a relationship between changing quantities before substituting a particular instant.
      - title: Optimization
        purpose: Build an objective function, identify the feasible domain, and justify local or absolute extrema.
    integration-foundations:
      - title: Antiderivatives and initial conditions
        purpose: Recover a quantity from its rate and account for the constant of integration.
      - title: Riemann sums and the definite integral
        purpose: Construct accumulation from small contributions and understand its limiting definition.
      - title: Integral properties, signed area, and net change
        purpose: Separate cancellation from total area and interpret accumulation consistently.
      - title: The Fundamental Theorem of Calculus
        purpose: Explain and prove the connection between continuous rates, accumulation functions, and antiderivatives.
    basic-integration:
      - title: Elementary integrals and substitution
        purpose: Reverse familiar derivative rules and handle changes of variable and integration bounds correctly.
      - title: Net change, total distance, and average value
        purpose: Select the appropriate integral when a rate changes sign or a quantity is averaged over an interval.
      - title: Area between curves
        purpose: Choose a variable of integration and split a region when its boundary order changes.
      - title: Volumes by slices and revolution
        purpose: Derive volume integrals from cross-sections and choose disks, washers, or shells to match the geometry.
  study_approach:
    - '**Understand the claim.** Read a definition or theorem together with its assumptions. Explain what it says in your own words and how it connects to an earlier idea.'
    - '**Work with purpose.** Examples illustrate a specific method or distinction. Activities ask a mathematical question, and their explanations remain usable without the interaction.'
    - '**Exercises review learning.** Use them to retrieve definitions, interpret representations, and practise techniques introduced in the lesson.'
    - '**Problems challenge understanding.** Expect unfamiliar combinations, proof, counterexamples, or modeling choices. The most challenging problems are identified and their statements remain visible.'
    - '**Explain before checking.** Attempt a complete solution before opening a hint or solution. Use chapter checkpoints and the final cumulative review to identify what needs another pass.'
  prerequisites:
    - '**Algebra:** equations, inequalities, factoring, fractions, exponents, and logarithms.'
    - '**Functions:** notation, domains and ranges, graphs, transformations, composition, and inverses.'
    - '**Trigonometry:** radians, the unit circle, sine, cosine, tangent, and basic identities.'
  prerequisite_note: To use the existing derivatives lessons now, first be comfortable with limits and continuity, including the standard limits those lessons cite.
  alignment_note: The core follows the first-semester single-variable coverage represented by the sources below. Some first-semester courses also introduce Newton's method or Taylor polynomials alongside approximation. Integration by parts, advanced integration methods, improper integrals, infinite series, and parametric or polar calculus belong to the later course in this sequence.
  curriculum_sources:
    - title: University of Utah — Calculus I, Fall 2025
      url: https://utah.simplesyllabus.com/api2/doc-pdf/zzetooyo6/Fall-2025-MATH-1210-070-.pdf
      description: Explicit outcomes for limits, differentiation, graph analysis, derivative applications, the Fundamental Theorem, substitution, area, and volumes.
    - title: University of Wisconsin–Madison — MATH 221
      url: https://www.math.wisc.edu/undergraduate/courses-enrollment/calculus/
      description: First-semester calculus with trigonometric, exponential, and logarithmic functions, differentiation, and the beginning of integral calculus and its applications.
    - title: University of Alberta — MATH 144
      url: https://apps.ualberta.ca/catalogue/course/math/144
      description: Single-variable differentiation and integration with physical-science applications; its inclusion of Taylor polynomials illustrates variation in first-course coverage.
