# Shared asset and loading registry. Used by both article and puzzle layouts.
lagrange-multipliers:
  script: /assets/js/widgets/lagrange-multipliers.mjs
  selector: '[data-widget="lagrange-multipliers"]'
  styles: [activities, widget-frame, lagrange-multipliers]
three-cups:
  script: /assets/js/widgets/three-cups.mjs
  selector: '[data-three-cups]'
  styles: [activities, three-cups, widget-frame]
stereographic-projection:
  script: /assets/js/widgets/stereographic-projection.mjs
  selector: '[data-widget="stereographic-projection"]'
  styles: [activities, widget-frame, stereographic-projection]
tilted-square:
  script: /assets/js/widgets/tilted-square.js
  selector: '[data-widget="tilted-square"]'
  styles: [widget-frame]
magicians-problem:
  script: /assets/js/widgets/magicians-problem.mjs
  selector: '[data-magician-game], [data-magician-probability], [data-magician-routes]'
  styles: [activities, magician, widget-frame]
cevian-triangles:
  script: /assets/js/widgets/cevian-triangles.mjs
  selector: '[data-cevian-explorer], [data-cevian-simplex]'
  styles: [activities, cevian, widget-frame]
lights-out:
  script: /assets/js/widgets/lights-out.mjs
  selector: '[data-lights-out], [data-lights-out-proof]'
  styles: [activities, graph-lights-out, lights-out, widget-frame]
graph-lights-out:
  script: /assets/js/widgets/graph-lights-out.mjs
  selector: '[data-graph-lights-out]'
  styles: [graph-lights-out, widget-frame, puzzle-game]
three-utilities:
  script: /assets/js/widgets/three-utilities.mjs
  selector: '[data-three-utilities-plane], [data-three-utilities-surface], [data-three-utilities-square]'
  styles: [activities, three-utilities, widget-frame]
hex:
  script: /assets/js/widgets/hex.mjs
  selector: '[data-hex-game], [data-hex-proof]'
  styles: [activities, hex, widget-frame, puzzle-game]
klotski:
  script: /assets/js/widgets/klotski.mjs
  selector: '[data-klotski-game]'
  styles: [klotski, widget-frame, puzzle-game]
tiling:
  script: /assets/js/widgets/tiling.mjs
  selector: '[data-tiling-game]'
  styles: [widget-frame, tiling, puzzle-game]
four-equal-regions:
  script: /assets/js/widgets/four-equal-regions.mjs
  selector: '[data-four-equal-regions]'
  styles: [widget-frame, four-equal-regions, puzzle-game]
cube-cuts:
  script: /assets/js/widgets/cube-cuts.mjs
  selector: '[data-cube-cuts]'
  styles: [widget-frame, cube-cuts]
othello:
  script: /assets/js/widgets/othello.mjs
  selector: '[data-othello-game]'
  styles: [widget-frame, othello, puzzle-game]
