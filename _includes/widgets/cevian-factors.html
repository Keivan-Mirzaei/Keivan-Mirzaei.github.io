  <div class="graph-heading"><h3 id="cv-factors-title">Where the extra area is lost</h3></div>
  <div data-cv-factors>{% include widgets/cevian-factors.svg %}</div>
  <p class="cv-caption">Green: 1 + t. Gold: 2√t. All six bars share one scale. Each green bar is at least as long as its gold partner; all pairs match exactly when a = b = c = 1.</p>

</section>
