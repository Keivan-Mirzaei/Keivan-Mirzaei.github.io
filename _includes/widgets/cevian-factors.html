<section class="graph-widget widget-frame cevian-widget" aria-labelledby="cv-factors-title">
  <div class="graph-heading"><h3 id="cv-factors-title">Where the extra area is lost</h3></div>
  <div data-cv-factors>{% include widgets/cevian-factors.svg %}</div>
  <p class="cv-caption">Green: 1 + t. Gold: <math><mn>2</mn><msqrt><mi>t</mi></msqrt></math>. All six bars share one scale. Each green bar is at least as long as its gold partner; all pairs match exactly when a = b = c = 1.</p>
  <p class="cv-numeric" data-cv-product>Denominator: approximately 9.53 ≥ 8. Area ratio: approximately 21.0%.</p>
  <button class="secondary-button" type="button" data-cv-center disabled>Make all three pairs equal</button>
</section>
