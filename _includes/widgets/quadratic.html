{% assign graph_id = include.id | default: 'quadratic' %}
<section class="graph-widget" data-widget="quadratic" aria-labelledby="{{ graph_id }}-heading">
  <div class="graph-heading">
    <h3 id="{{ graph_id }}-heading">Move a parabola</h3>
    <p class="graph-equation" data-equation>y = 1(x − 0)² + 0</p>
  </div>
  <svg class="function-plot" viewBox="0 0 600 340" role="img" aria-labelledby="{{ graph_id }}-title {{ graph_id }}-description">
    <title id="{{ graph_id }}-title">Graph of a quadratic function</title>
    <desc id="{{ graph_id }}-description" data-plot-description>The curve y = x squared, with its vertex at (0, 0), on a graph from x = −4 to 4 and y = −6 to 6.</desc>
    <defs><clipPath id="{{ graph_id }}-clip"><rect x="44" y="20" width="536" height="276"/></clipPath></defs>
    <g class="plot-grid" aria-hidden="true">
      <path d="M44 20H580M44 89H580M44 158H580M44 227H580M44 296H580M44 20V296M178 20V296M312 20V296M446 20V296M580 20V296"/>
    </g>
    <g class="plot-axes" aria-hidden="true"><path d="M44 158H580M312 20V296"/></g>
    <g class="plot-labels" aria-hidden="true">
      <text x="44" y="317">−4</text><text x="178" y="317">−2</text><text x="312" y="317">0</text><text x="446" y="317">2</text><text x="580" y="317">4</text>
      <text x="26" y="25">6</text><text x="26" y="94">3</text><text x="26" y="163">0</text><text x="26" y="232">−3</text><text x="26" y="301">−6</text>
      <text x="592" y="162">x</text><text x="314" y="16">y</text>
    </g>
    <g clip-path="url(#{{ graph_id }}-clip)">
      <path class="plot-reference" d="M44 -210 Q312 526 580 -210"/>
      <path class="plot-curve" data-curve d="M44 -210 Q312 526 580 -210"/>
      <circle class="plot-vertex" data-vertex cx="312" cy="158" r="5"/>
    </g>
  </svg>
  <p class="plot-legend"><span>Solid: your curve</span><span>Dashed: y = x²</span></p>
  <div class="graph-controls">
    <label for="{{ graph_id }}-a">Shape <span>a = <output data-value="a">1</output></span></label>
    <input id="{{ graph_id }}-a" name="a" type="range" min="-2" max="2" step="0.25" value="1" disabled>
    <label for="{{ graph_id }}-h">Horizontal shift <span>h = <output data-value="h">0</output></span></label>
    <input id="{{ graph_id }}-h" name="h" type="range" min="-3" max="3" step="0.25" value="0" disabled>
    <label for="{{ graph_id }}-k">Vertical shift <span>k = <output data-value="k">0</output></span></label>
    <input id="{{ graph_id }}-k" name="k" type="range" min="-3" max="3" step="0.25" value="0" disabled>
  </div>
  <div class="graph-actions">
    <p class="graph-feedback" data-feedback role="status" aria-live="polite">The vertex is (0, 0). The curve opens upward.</p>
    <button class="secondary-button" type="button" data-reset disabled>Reset</button>
  </div>
  <details class="graph-values">
    <summary>Read the values as a table</summary>
    <table>
      <caption>Selected points on your curve</caption>
      <thead><tr><th scope="col">x</th><th scope="col">y</th></tr></thead>
      <tbody>
        <tr><th scope="row">−2</th><td data-x="-2">4</td></tr>
        <tr><th scope="row">−1</th><td data-x="-1">1</td></tr>
        <tr><th scope="row">0</th><td data-x="0">0</td></tr>
        <tr><th scope="row">1</th><td data-x="1">1</td></tr>
        <tr><th scope="row">2</th><td data-x="2">4</td></tr>
      </tbody>
    </table>
  </details>
  <noscript><p>The graph and table show y = x². Enable JavaScript to change the parameters.</p></noscript>
</section>
