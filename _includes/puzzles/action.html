<button class="puzzle-icon-button" type="button" data-{{ include.game }}-{{ include.action }} data-puzzle-icon aria-label="{{ include.label | escape }}" data-tooltip="{{ include.label | escape }}"{% if include.hidden %} hidden{% endif %}{% unless include.enabled %} disabled{% endunless %}>
  {% if include.icon == 'hint' %}<span class="puzzle-action-default">{% include icon.html name='hint' %}</span><span class="puzzle-action-confirm">{% include icon.html name='confirm' %}</span>{% else %}{% include icon.html name=include.icon %}{% endif %}
</button>
