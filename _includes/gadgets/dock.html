<div class="gadget-dock" data-gadget-dock data-gadgets-url="{{ '/gadgets/' | relative_url }}" hidden>
  <div class="gadget-dock-timer" data-dock-timer hidden>
    <a data-dock-timer-link href="{{ '/gadgets/' | relative_url }}"><span data-dock-label>Timer</span><span class="gadget-time" data-dock-time>00:00</span><span class="sr-only" data-dock-state></span></a>
    <button type="button" data-gadget-action="timer-toggle" data-dock-pause aria-label="Pause timer">{% include icon.html name='pause' %}</button>
  </div>
  <div class="gadget-dock-sound" data-dock-sound hidden>
    <a data-dock-sound-link href="{{ '/gadgets/sound/' | relative_url }}">{% include icon.html name='sound' %}<span data-dock-sound-label>Sound</span></a>
    <button type="button" data-gadget-action="sound-toggle" data-dock-sound-pause aria-label="Pause sound">{% include icon.html name='pause' %}</button>
  </div>
  <button class="gadget-dock-more" type="button" data-gadget-action="controls" aria-controls="gadget-controls" aria-expanded="false" aria-label="Open active gadget controls">{% include icon.html name='settings' %}</button>
</div>
<template data-gadget-icon-play>{% include icon.html name='play' %}</template>
<template data-gadget-icon-pause>{% include icon.html name='pause' %}</template>
