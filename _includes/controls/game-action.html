<button class="puzzle-icon-button" type="button" {% if include.panel %}data-widget-panel-trigger="{{ include.panel }}" aria-expanded="false"{% else %}data-{{ include.game }}-{{ include.action }}{% endif %} data-puzzle-icon aria-label="{{ include.label | default: include.title }}" data-tooltip="{{ include.title }}"{% if include.toggle %} aria-pressed="false"{% endif %} disabled>{% include icon.html name=include.icon %}{% if include.text_key %}<span class="sr-only" data-{{ include.game }}-{{ include.text_key }}>{{ include.title }}</span>{% endif %}</button>
